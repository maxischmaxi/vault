[package]
name = "vault"
version = "0.1.0"
edition = "2021"
description = "Encrypted secret manager with shell environment injection"
authors = ["maxischmaxi"]

[dependencies]
clap = { version = "4", features = ["derive"] }
anyhow = "1"
dirs = "6"
age = "0.11"
rpassword = "7"
clap_complete = "4"
serde = { version = "1", features = ["derive"] }
toml = "0.8"

[profile.release]
opt-level = 2
strip = true